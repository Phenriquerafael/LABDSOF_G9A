<svg xmlns="http://www.w3.org/2000/svg" width="680" height="540" viewBox="0 0 680 540" role="img"><title>Workflow 10: this affects me too</title><desc>The admin publishes an anonymised summary. Residents who are also affected tap a button and a counter goes up. The admin sees the affected count and can link duplicate reports.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="540" fill="#FFFFFF"/><rect x="130.0" y="40" width="240" height="36" rx="18" fill="#F7F6F2" stroke="#888780" stroke-width="1"/><text x="250" y="58.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Issue is open</text><path d="M250 76 L250 95" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="100.0" y="98" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="250" y="118" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#3C3489">Admin publishes summary</text><text x="250" y="136" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#534AB7">No names or private data</text><path d="M250 154 L250 173" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="100.0" y="176" width="300" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="250" y="198.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#085041">Building residents see it</text><path d="M250 220 L250 239" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><polygon points="250,242 370,276 250,310 130,276" fill="#F7F6F2" stroke="#888780" stroke-width="1"/><text x="250" y="268" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Also affects</text><text x="250" y="284" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">a resident?</text><path d="M250 310 L250 333" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="262" y="323.0" text-anchor="start" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">No</text><rect x="100.0" y="336" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="250" y="356" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#085041">Admin sees affected count</text><text x="250" y="374" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#0F6E56">Can link duplicate reports</text><path d="M250 392 L250 411" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="100.0" y="414" width="300" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="250" y="436.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#3C3489">Residents follow status</text><path d="M250 458 L250 477" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="100.0" y="480" width="300" height="36" rx="18" fill="#F7F6F2" stroke="#888780" stroke-width="1"/><text x="250" y="498.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Fewer repeat reports and calls</text><path d="M370 276 L427.0 276" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="380" y="264" text-anchor="start" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">Yes</text><rect x="430.0" y="254.0" width="210" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="535" y="276.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#3C3489">Taps 'affects me too'</text><path d="M535 298.0 L535 319.0" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="430.0" y="322.0" width="210" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="535" y="344.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#085041">Counter goes up</text><path d="M430.0 344.0 L404.0 344.0" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="8" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="58" y="14" text-anchor="start" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">Person</text><rect x="120" y="8" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="138" y="14" text-anchor="start" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">System / AI</text></svg>