<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" role="img"><title>Workflow 8b: closure and reopening</title><desc>The admin reviews the completed work. If not resolved it is returned with a reason. If resolved the issue is closed and the resident notified. A returning problem can be reopened with a reason.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="490" fill="#FFFFFF"/><rect x="130.0" y="40" width="240" height="36" rx="18" fill="#F7F6F2" stroke="#888780" stroke-width="1"/><text x="250" y="58.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Work awaits validation</text><path d="M250 76 L250 95" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="100.0" y="98" width="300" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="250" y="120.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#3C3489">Admin reviews the work</text><path d="M250 142 L250 161" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><polygon points="250,164 370,198 250,232 130,198" fill="#F7F6F2" stroke="#888780" stroke-width="1"/><text x="250" y="198" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Resolved?</text><path d="M250 232 L250 255" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="262" y="245.0" text-anchor="start" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">Yes</text><rect x="100.0" y="258" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="250" y="278" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#085041">Issue closed</text><text x="250" y="296" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#0F6E56">Resident is notified</text><path d="M250 314 L250 333" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><polygon points="250,336 370,370 250,404 130,370" fill="#F7F6F2" stroke="#888780" stroke-width="1"/><text x="250" y="370" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Problem returns?</text><path d="M250 404 L250 427" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="262" y="417.0" text-anchor="start" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">No</text><rect x="130.0" y="430" width="240" height="36" rx="18" fill="#F7F6F2" stroke="#888780" stroke-width="1"/><text x="250" y="448.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Closed, history kept</text><path d="M370 198 L427.0 198" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="380" y="186" text-anchor="start" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">No</text><rect x="430.0" y="170.0" width="210" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="535" y="190.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#3C3489">Returns it</text><text x="535" y="208.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#534AB7">With a reason</text><path d="M535 226.0 L535 247.0" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="430.0" y="250.0" width="210" height="36" rx="18" fill="#F7F6F2" stroke="#888780" stroke-width="1"/><text x="535" y="268.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Back to flows 4 and 5</text><path d="M370 370 L427.0 370" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="380" y="358" text-anchor="start" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">Yes</text><rect x="430.0" y="342.0" width="210" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="535" y="362.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#3C3489">Admin reopens</text><text x="535" y="380.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#534AB7">With a reason</text><path d="M535 398.0 L535 419.0" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="430.0" y="422.0" width="210" height="36" rx="18" fill="#F7F6F2" stroke="#888780" stroke-width="1"/><text x="535" y="440.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Back to flows 4 and 5</text><rect x="40" y="8" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="58" y="14" text-anchor="start" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">Person</text><rect x="120" y="8" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="138" y="14" text-anchor="start" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">System / AI</text></svg>