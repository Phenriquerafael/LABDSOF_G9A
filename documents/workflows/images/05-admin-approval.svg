<svg xmlns="http://www.w3.org/2000/svg" width="730" height="460" viewBox="0 0 730 460" role="img"><title>Workflow 5: admin approval</title><desc>The admin reviews the proposal and confirms the classification as its own step. Only an approved version goes to the contractor. Refusing with a reason leads to the next AI option or a manual pick, which needs approval again.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="730" height="460" fill="#FFFFFF"/><rect x="40" y="6" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="58" y="13" text-anchor="start" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">Person</text><rect x="120" y="6" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="138" y="13" text-anchor="start" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">System / AI</text><rect x="100.0" y="40" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="250" y="59.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#3C3489">Admin reviews the proposal</text><text x="250" y="77.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#534AB7">Classification, contractor, day, price</text><path d="M250 96 L250 120" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="100.0" y="120" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="250" y="139.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#3C3489">Confirms classification</text><text x="250" y="157.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#534AB7">Triage decision, with reason if corrected</text><path d="M250 176 L250 200" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><polygon points="250,200.0 390.0,235 250,270.0 110.0,235" fill="#F7F6F2" stroke="#888780" stroke-width="1"/><text x="250" y="235" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Approves this version?</text><path d="M250 270 L250 296" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="262" y="283" text-anchor="start" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">Yes</text><rect x="100.0" y="296" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="250" y="315.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#085041">Sends temporary request</text><text x="250" y="333.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#0F6E56">Only the approved version</text><path d="M250 352 L250 384" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="130.0" y="384" width="240" height="36" rx="18.0" fill="#F7F6F2" stroke="#888780" stroke-width="1"/><text x="250" y="402.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">To flow 6: contractor</text><path d="M390 235 L470 235" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="400" y="226" text-anchor="start" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">No</text><rect x="470.0" y="207" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="590" y="226.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#3C3489">Refuses, with a reason</text><text x="590" y="244.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#534AB7">Next option or manual pick</text><path d="M590 263 L590 300" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="470.0" y="300" width="240" height="36" rx="18.0" fill="#F7F6F2" stroke="#888780" stroke-width="1"/><text x="590" y="318.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Next option or new approval</text></svg>