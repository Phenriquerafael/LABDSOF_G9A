<svg xmlns="http://www.w3.org/2000/svg" width="680" height="384" viewBox="0 0 680 384" role="img"><title>Workflow 7b: resident cancellation request</title><desc>The resident asks the admin to cancel. The admin is notified and decides. If approved, the admin cancels through the previous flow. If not, the booking stays.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="384" fill="#FFFFFF"/><rect x="130.0" y="40" width="240" height="36" rx="18" fill="#F7F6F2" stroke="#888780" stroke-width="1"/><text x="250" y="58.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Resident wants to cancel</text><path d="M250 76 L250 95" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="100.0" y="98" width="300" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="250" y="120.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#3C3489">Asks admin to cancel</text><path d="M250 142 L250 161" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="100.0" y="164" width="300" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="250" y="186.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#085041">Admin is notified</text><path d="M250 208 L250 227" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><polygon points="250,230 370,264 250,298 130,264" fill="#F7F6F2" stroke="#888780" stroke-width="1"/><text x="250" y="264" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Admin approves?</text><path d="M250 298 L250 321" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="262" y="311.0" text-anchor="start" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">Yes</text><rect x="115.0" y="324" width="270" height="36" rx="18" fill="#F7F6F2" stroke="#888780" stroke-width="1"/><text x="250" y="342.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Admin cancels (previous flow)</text><path d="M370 264 L427.0 264" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="380" y="252" text-anchor="start" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">No</text><rect x="430.0" y="246.0" width="210" height="36" rx="18" fill="#F7F6F2" stroke="#888780" stroke-width="1"/><text x="535" y="264.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Booking stays</text><rect x="40" y="8" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="58" y="14" text-anchor="start" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">Person</text><rect x="120" y="8" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="138" y="14" text-anchor="start" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">System / AI</text></svg>