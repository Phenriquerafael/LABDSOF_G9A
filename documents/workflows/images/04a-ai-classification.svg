<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img"><title>Workflow 4a: AI classification</title><desc>The AI suggests a category and priority with a reason. If it fails, the admin classifies manually.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="330" fill="#FFFFFF"/><rect x="130.0" y="40" width="240" height="36" rx="18" fill="#F7F6F2" stroke="#888780" stroke-width="1"/><text x="250" y="58.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Report received</text><path d="M250 76 L250 95" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="100.0" y="98" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="250" y="118" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#085041">AI suggests category and priority</text><text x="250" y="136" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#0F6E56">Plain-language reason attached</text><path d="M250 154 L250 173" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><polygon points="250,176 370,210 250,244 130,210" fill="#F7F6F2" stroke="#888780" stroke-width="1"/><text x="250" y="210" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">AI failed?</text><path d="M250 244 L250 267" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="262" y="257.0" text-anchor="start" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">No</text><rect x="130.0" y="270" width="240" height="36" rx="18" fill="#F7F6F2" stroke="#888780" stroke-width="1"/><text x="250" y="288.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#2C2C2A">Category and priority set</text><path d="M370 210 L427.0 210" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="380" y="198" text-anchor="start" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">Yes</text><rect x="430.0" y="182.0" width="210" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="535" y="202.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="14" font-weight="700" fill="#3C3489">Admin classifies</text><text x="535" y="220.0" text-anchor="middle" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#534AB7">Manual fallback</text><path d="M535 238.0 L535 288.0 L374.0 288.0" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="8" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="58" y="14" text-anchor="start" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">Person</text><rect x="120" y="8" width="12" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="138" y="14" text-anchor="start" dominant-baseline="central" font-family="'Liberation Sans','Arial','Helvetica',sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">System / AI</text></svg>