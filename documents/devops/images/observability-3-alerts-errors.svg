<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="sans-serif" font-size="16">
  <title>Alerts and errors</title>
  <style>
    .node { fill: #ececff; stroke: #9370db; stroke-width: 1.5; }
    .ext { fill: #f7f7f7; stroke: #888; stroke-width: 1.5; }
    .ec2 { fill: #fffbe6; stroke: #b8a400; stroke-width: 1.5; stroke-dasharray: 8 4; }
    .line { stroke: #333; stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 6 4; }
    .lbl { fill: #222; font-size: 14; }
    .sub { font-size: 14; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#ffffff"/>

  <!-- External: uptime check and chat webhook -->
  <rect class="ext" x="20" y="20" width="280" height="76" rx="8"/>
  <text x="160" y="50" text-anchor="middle">External uptime check</text>
  <text class="sub" x="160" y="74" text-anchor="middle">(outside the instance)</text>

  <rect class="ext" x="420" y="20" width="300" height="76" rx="8"/>
  <text x="570" y="50" text-anchor="middle">Discord / Telegram</text>
  <text class="sub" x="570" y="74" text-anchor="middle">webhook</text>

  <line class="line" x1="300" y1="58" x2="418" y2="58" marker-end="url(#arrow)"/>
  <text class="lbl" x="360" y="48" text-anchor="middle">site down</text>

  <!-- Instance boundary -->
  <rect class="ec2" x="20" y="140" width="860" height="300" rx="10"/>
  <text x="866" y="170" text-anchor="end" font-weight="bold" font-size="17">AWS EC2 server (one machine), containers run via Docker Compose</text>

  <rect class="node" x="100" y="200" width="280" height="90" rx="8"/>
  <text x="240" y="238" text-anchor="middle">Grafana</text>
  <text class="sub" x="240" y="262" text-anchor="middle">alert rules</text>

  <line class="line" x1="300" y1="200" x2="462" y2="96" marker-end="url(#arrow)"/>
  <text class="lbl" x="150" y="186">metric alerts</text>

  <rect class="node" x="520" y="200" width="280" height="90" rx="8"/>
  <text x="660" y="238" text-anchor="middle">Dispatch, Issue and auth</text>
  <text class="sub" x="660" y="262" text-anchor="middle">log errors with request_id</text>

  <!-- External: Sentry -->
  <line class="line dash" x1="660" y1="290" x2="660" y2="468" marker-end="url(#arrow)"/>
  <text class="lbl" x="672" y="384">exceptions</text>

  <rect class="ext" x="520" y="470" width="280" height="64" rx="8"/>
  <text x="660" y="500" text-anchor="middle">Sentry (hosted, free plan)</text>
  <text class="sub" x="660" y="522" text-anchor="middle">receives errors</text>
</svg>
