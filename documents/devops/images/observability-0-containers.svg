<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" font-family="sans-serif" font-size="16">
  <title>Container layout by layer</title>
  <style>
    .node { fill: #ececff; stroke: #9370db; stroke-width: 1.5; }
    .ext { fill: #f7f7f7; stroke: #888; stroke-width: 1.5; }
    .ec2 { fill: #fffbe6; stroke: #b8a400; stroke-width: 1.5; stroke-dasharray: 8 4; }
    .line { stroke: #333; stroke-width: 1.5; fill: none; }
    .dash { stroke-dasharray: 6 4; }
    .lbl { fill: #222; font-size: 14; }
    .band { fill: #444; font-size: 16; font-weight: bold; }
    .sub { font-size: 14; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="640" fill="#ffffff"/>

  <!-- Server boundary: application layers only -->
  <rect class="ec2" x="10" y="20" width="880" height="470" rx="10"/>
  <text x="24" y="50" font-weight="bold" font-size="17">AWS EC2 server (one machine), containers run via Docker Compose</text>

  <!-- Layer 1: gateway -->
  <text class="band" x="24" y="90">1. Gateway</text>
  <rect class="node" x="230" y="100" width="440" height="76" rx="8"/>
  <text x="450" y="130" text-anchor="middle">gateway (nginx)</text>
  <text class="sub" x="450" y="154" text-anchor="middle">routes by path, creates X-Request-ID</text>

  <line class="line" x1="280" y1="176" x2="160" y2="246" marker-end="url(#arrow)"/>
  <line class="line" x1="450" y1="176" x2="450" y2="246" marker-end="url(#arrow)"/>
  <line class="line" x1="620" y1="176" x2="740" y2="246" marker-end="url(#arrow)"/>
  <text class="lbl" x="200" y="222" text-anchor="end">/dispatch</text>
  <text class="lbl" x="462" y="222">/auth</text>
  <text class="lbl" x="716" y="222">/issue</text>

  <!-- Layer 2: services -->
  <text class="band" x="24" y="236">2. Services</text>
  <rect class="node" x="40" y="246" width="260" height="90" rx="8"/>
  <text x="170" y="276" text-anchor="middle">Dispatch</text>
  <text class="sub" x="170" y="298" text-anchor="middle">/dispatch/*</text>
  <text class="sub" x="170" y="318" text-anchor="middle">/metrics, /healthz, /readyz</text>

  <rect class="node" x="320" y="246" width="260" height="90" rx="8"/>
  <text x="450" y="276" text-anchor="middle">auth</text>
  <text class="sub" x="450" y="298" text-anchor="middle">login, tokens, roles</text>
  <text class="sub" x="450" y="318" text-anchor="middle">/metrics, /healthz, /readyz</text>

  <rect class="node" x="600" y="246" width="260" height="90" rx="8"/>
  <text x="730" y="276" text-anchor="middle">Issue</text>
  <text class="sub" x="730" y="298" text-anchor="middle">/issue/*</text>
  <text class="sub" x="730" y="318" text-anchor="middle">/metrics, /healthz, /readyz</text>

  <!-- Layer 3: messaging (under consideration) -->
  <line class="line dash" x1="170" y1="336" x2="350" y2="410" marker-end="url(#arrow)"/>
  <text class="lbl" x="296" y="372" text-anchor="end">publishes events</text>
  <line class="line dash" x1="730" y1="336" x2="570" y2="410" marker-end="url(#arrow)"/>
  <text class="lbl" x="612" y="372">delivers events</text>

  <rect class="node" x="350" y="390" width="220" height="80" rx="8" stroke-dasharray="6 4"/>
  <text x="460" y="422" text-anchor="middle">RabbitMQ</text>
  <text class="sub" x="460" y="446" text-anchor="middle">queues between services</text>
  <text class="band" x="24" y="438">3. Messaging</text>
  <text class="sub" x="24" y="458">(under consideration)</text>

  <!-- Outside the server -->
  <rect class="ext" x="40" y="550" width="260" height="56" rx="8"/>
  <text x="170" y="576" text-anchor="middle">External uptime check</text>
  <text class="sub" x="170" y="596" text-anchor="middle">checks the public URL</text>

  <rect class="ext" x="320" y="550" width="260" height="56" rx="8"/>
  <text x="450" y="576" text-anchor="middle">Discord / Telegram</text>
  <text class="sub" x="450" y="596" text-anchor="middle">receives alerts</text>

  <rect class="ext" x="600" y="550" width="260" height="56" rx="8"/>
  <text x="730" y="576" text-anchor="middle">Sentry (hosted)</text>
  <text class="sub" x="730" y="596" text-anchor="middle">receives errors from services</text>
</svg>
