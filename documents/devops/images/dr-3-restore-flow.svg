<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="sans-serif" font-size="20">
  <title>Restore runbook</title>
  <style>
    .box { fill: #e6f0ff; stroke: #3a7bd5; stroke-width: 2; }
    .check { fill: #e3f5e1; stroke: #2e7d32; stroke-width: 2; }
    .line { stroke: #333; stroke-width: 2; fill: none; }
    .sub { font-size: 16; fill: #444; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#ffffff"/>

  <!-- Row 1: left to right -->
  <rect class="box" x="40" y="40" width="240" height="84" rx="10"/>
  <text x="160" y="76" text-anchor="middle">1. Freeze writes</text>
  <text class="sub" x="160" y="102" text-anchor="middle">maintenance mode</text>
  <rect class="box" x="330" y="40" width="240" height="84" rx="10"/>
  <text x="450" y="76" text-anchor="middle">2. Pick the dump</text>
  <text class="sub" x="450" y="102" text-anchor="middle">latest that passes</text>
  <rect class="box" x="620" y="40" width="240" height="84" rx="10"/>
  <text x="740" y="76" text-anchor="middle">3. New server</text>
  <text class="sub" x="740" y="102" text-anchor="middle">clone the Git tag</text>
  <line class="line" x1="280" y1="82" x2="328" y2="82" marker-end="url(#arrow)"/>
  <line class="line" x1="570" y1="82" x2="618" y2="82" marker-end="url(#arrow)"/>

  <!-- Row 2: right to left -->
  <line class="line" x1="740" y1="124" x2="740" y2="168" marker-end="url(#arrow)"/>
  <rect class="box" x="620" y="170" width="240" height="84" rx="10"/>
  <text x="740" y="206" text-anchor="middle">4. Restore secrets</text>
  <text class="sub" x="740" y="232" text-anchor="middle">from the secrets store</text>
  <rect class="box" x="330" y="170" width="240" height="84" rx="10"/>
  <text x="450" y="206" text-anchor="middle">5. Restore database</text>
  <text class="sub" x="450" y="232" text-anchor="middle">snapshot or dump</text>
  <rect class="check" x="40" y="170" width="240" height="84" rx="10"/>
  <text x="160" y="206" text-anchor="middle">6. Check data</text>
  <text class="sub" x="160" y="232" text-anchor="middle">checksums, row counts</text>
  <line class="line" x1="620" y1="212" x2="572" y2="212" marker-end="url(#arrow)"/>
  <line class="line" x1="330" y1="212" x2="282" y2="212" marker-end="url(#arrow)"/>

  <!-- Row 3: left to right -->
  <line class="line" x1="160" y1="254" x2="160" y2="298" marker-end="url(#arrow)"/>
  <rect class="box" x="40" y="300" width="240" height="84" rx="10"/>
  <text x="160" y="336" text-anchor="middle">7. Start services</text>
  <text class="sub" x="160" y="362" text-anchor="middle">auth first</text>
  <rect class="box" x="330" y="300" width="240" height="84" rx="10"/>
  <text x="450" y="336" text-anchor="middle">8. Restore broker</text>
  <text class="sub" x="450" y="362" text-anchor="middle">definitions, outbox</text>
  <rect class="box" x="620" y="300" width="240" height="84" rx="10"/>
  <text x="740" y="336" text-anchor="middle">9. Reopen</text>
  <text class="sub" x="740" y="362" text-anchor="middle">smoke test</text>
  <line class="line" x1="280" y1="342" x2="328" y2="342" marker-end="url(#arrow)"/>
  <line class="line" x1="570" y1="342" x2="618" y2="342" marker-end="url(#arrow)"/>

  <text class="sub" x="40" y="414">If step 6 fails, go back to step 2.</text>
</svg>
