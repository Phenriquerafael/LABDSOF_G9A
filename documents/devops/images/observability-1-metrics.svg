<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="900" height="580" font-family="sans-serif" font-size="16">
  <title>Metrics and health</title>
  <style>
    .node { fill: #ececff; stroke: #9370db; stroke-width: 1.5; }
    .ec2 { fill: #fffbe6; stroke: #b8a400; stroke-width: 1.5; stroke-dasharray: 8 4; }
    .ext { fill: #f7f7f7; stroke: #888; stroke-width: 1.5; }
    .line { stroke: #333; stroke-width: 1.5; fill: none; }
    .lbl { fill: #222; font-size: 14; }
    .sub { font-size: 14; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="900" height="580" fill="#ffffff"/>

  <!-- Entry point, outside the server -->
  <rect class="ext" x="20" y="10" width="260" height="60" rx="8"/>
  <text x="150" y="36" text-anchor="middle">You</text>
  <text class="sub" x="150" y="58" text-anchor="middle">SSH tunnel or nginx auth</text>
  <line class="line" x1="150" y1="70" x2="150" y2="168" marker-end="url(#arrow)"/>

  <!-- Server boundary -->
  <rect class="ec2" x="10" y="95" width="880" height="470" rx="10"/>
  <text x="24" y="124" font-weight="bold" font-size="17">AWS EC2 server (one machine), containers run via Docker Compose</text>

  <!-- Grafana and Prometheus -->
  <rect class="node" x="40" y="170" width="220" height="76" rx="8"/>
  <text x="150" y="200" text-anchor="middle">Grafana</text>
  <text class="sub" x="150" y="224" text-anchor="middle">dashboard + alerts</text>

  <line class="line" x1="260" y1="208" x2="318" y2="208" marker-end="url(#arrow)"/>
  <text class="lbl" x="289" y="196" text-anchor="middle">query</text>

  <rect class="node" x="320" y="170" width="220" height="76" rx="8"/>
  <text x="430" y="200" text-anchor="middle">Prometheus</text>
  <text class="sub" x="430" y="224" text-anchor="middle">scrapes every 30 s</text>

  <!-- Scrape targets -->
  <line class="line" x1="540" y1="208" x2="588" y2="188" marker-end="url(#arrow)"/>
  <line class="line" x1="540" y1="208" x2="588" y2="288" marker-end="url(#arrow)"/>
  <line class="line" x1="540" y1="208" x2="588" y2="388" marker-end="url(#arrow)"/>
  <line class="line" x1="540" y1="208" x2="588" y2="488" marker-end="url(#arrow)"/>

  <rect class="node" x="590" y="150" width="280" height="76" rx="8"/>
  <text x="730" y="180" text-anchor="middle">Services (Dispatch, auth, Issue)</text>
  <text class="sub" x="730" y="204" text-anchor="middle">/metrics, /healthz, /readyz, /status</text>

  <rect class="node" x="590" y="250" width="280" height="76" rx="8"/>
  <text x="730" y="280" text-anchor="middle">node_exporter + cAdvisor</text>
  <text class="sub" x="730" y="304" text-anchor="middle">host and container metrics</text>

  <rect class="node" x="590" y="350" width="280" height="76" rx="8"/>
  <text x="730" y="380" text-anchor="middle">blackbox_exporter</text>
  <text class="sub" x="730" y="404" text-anchor="middle">probes the public URL</text>

  <rect class="node" x="590" y="450" width="280" height="76" rx="8" stroke-dasharray="6 4"/>
  <text x="730" y="480" text-anchor="middle">RabbitMQ (optional)</text>
  <text class="sub" x="730" y="504" text-anchor="middle">plugin metrics, port 15692</text>
</svg>
