<text x="49" y="814.5" font-size="11.5" fill="#000000" text-anchor="start" dominant-baseline="central">Services do not call each other over HTTP (ADR-001); they exchange events through RabbitMQ, which carry</text><text x="49" y="829.5" font-size="11.5" fill="#000000" text-anchor="start" dominant-baseline="central">correlationid and traceparent (ADR-003). Outbound calls to Google Calendar and the AI provider also carry the ID in HTTP headers (not drawn).</text><text x="49" y="844.5" font-size="11.5" fill="#000000" text-anchor="start" dominant-baseline="central">Loki is optional; without it, logs are read with docker logs.</text>
