<text x="49" y="574.5" font-size="11.5" fill="#000000" text-anchor="start" dominant-baseline="central">1  mysqldump of each database with the read-only backup user; nothing is written back.</text><text x="49" y="589.5" font-size="11.5" fill="#000000" text-anchor="start" dominant-baseline="central">2  Compress the dump and write a SHA-256 checksum beside it.</text><text x="49" y="604.5" font-size="11.5" fill="#000000" text-anchor="start" dominant-baseline="central">3  Copy both files to bmc-backups with the bucket key from the host environment.</text><text x="49" y="619.5" font-size="11.5" fill="#000000" text-anchor="start" dominant-baseline="central">4  Copy new or changed photos to bmc-backups/attachments/ and write a checksum manifest.</text><text x="49" y="634.5" font-size="11.5" fill="#000000" text-anchor="start" dominant-baseline="central">5  Next night: restore the newest dump into a scratch container and compare row counts and</text><text x="49" y="649.5" font-size="11.5" fill="#000000" text-anchor="start" dominant-baseline="central">    the photo manifest; a failure raises an alert. Local copies older than a day are deleted.</text>
</svg>
