<text x="1140" y="965.5" font-size="12" font-weight="normal" fill="#000000" text-anchor="start" dominant-baseline="central">Traefik Proxy has no JWT middleware: each Spring service</text><text x="1140" y="980.5" font-size="12" font-weight="normal" fill="#000000" text-anchor="start" dominant-baseline="central">is an OAuth2 resource server, authorises against its own</text><text x="1140" y="995.5" font-size="12" font-weight="normal" fill="#000000" text-anchor="start" dominant-baseline="central">data and answers 404 outside the caller&#x27;s scope.</text>
