<text x="129" y="1024.5" font-size="11.5" fill="#000000" text-anchor="start" dominant-baseline="central">The plugin keeps the session in an encrypted HttpOnly cookie and sends</text><text x="129" y="1039.5" font-size="11.5" fill="#000000" text-anchor="start" dominant-baseline="central">Authorization: Bearer &lt;access token&gt; upstream (Headers template, E88). It is a</text><text x="129" y="1054.5" font-size="11.5" fill="#000000" text-anchor="start" dominant-baseline="central">community plugin and Traefik plugins are experimental (E89); spike item 3.</text>
<path d="M1130 1010 h510 l10 10 v49 h-520 z" fill="#FFFFFF" stroke="#000000" stroke-width="1.1"/><path d="M1640 1010 v10 h10" fill="none" stroke="#000000" stroke-width="1.1"/>
<text x="1139" y="1024.5" font-size="11.5" fill="#000000" text-anchor="start" dominant-baseline="central">Traefik Proxy has no JWT middleware: each Spring service is an</text><text x="1139" y="1039.5" font-size="11.5" fill="#000000" text-anchor="start" dominant-baseline="central">OAuth2 resource server, authorises against its own data and</text><text x="1139" y="1054.5" font-size="11.5" fill="#000000" text-anchor="start" dominant-baseline="central">answers 404 outside the caller&#x27;s scope (ADR-005).</text>
