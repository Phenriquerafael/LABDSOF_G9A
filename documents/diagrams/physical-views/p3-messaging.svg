<path d="M1442 600 H1430 V676 H1442" stroke="#000000" stroke-width="2" fill="none"/>
<text x="1440" y="614.0" font-size="12" text-anchor="start" dominant-baseline="central"><tspan x="1440" dy="0">TriageRequested is the only message with</tspan><tspan x="1440" dy="16">private report text: bound only to</tspan><tspan x="1440" dy="16">ai-triage.requests, never logged; its DLQ</tspan><tspan x="1440" dy="16">copy expires after 7 days (ADR-003, 008).</tspan></text>
<path d="M1442 700 H1430 V760 H1442" stroke="#000000" stroke-width="2" fill="none"/>
<text x="1440" y="714.0" font-size="12" text-anchor="start" dominant-baseline="central"><tspan x="1440" dy="0">The Spring consumers keep processed event IDs,</tspan><tspan x="1440" dy="16">so a duplicate is acknowledged without</tspan><tspan x="1440" dy="16">repeating the effect (ADR-003).</tspan></text>
