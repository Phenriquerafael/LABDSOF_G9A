<text x="1010" y="120.5" font-size="12" font-weight="normal" fill="#000000" text-anchor="start" dominant-baseline="central">Every Spring service also needs Keycloak&#x27;s signing keys;</text><text x="1010" y="135.5" font-size="12" font-weight="normal" fill="#000000" text-anchor="start" dominant-baseline="central">that connection is not drawn and its route is open (P-05).</text><text x="1010" y="150.5" font-size="12" font-weight="normal" fill="#000000" text-anchor="start" dominant-baseline="central">Calls to a platform component or to the calendar are not</text><text x="1010" y="165.5" font-size="12" font-weight="normal" fill="#000000" text-anchor="start" dominant-baseline="central">service-to-service calls (ADR-001).</text>
