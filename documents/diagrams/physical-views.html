      title: 'P7 · Compose profiles and rollout order',
      subtitle: 'ADR-004 proposal for the first vertical slice, to decide at the team review (EN01-U1). Memory of each set is not measured (spike item 8).',
      direction: 'RIGHT',
      nodeWidth: 200,
      forceOrder: true,
      nodes: [
        G('first', 'First · profile core · 8 containers', 'netEdge', [
          N('c1', 'Edge and sign-in', 'traefik · oauth2-proxy · keycloak', 'edge', { icon: 'router' }),
          N('c2', 'Data and messaging', 'mysql · rabbitmq', 'store', { icon: 'db' }),
          N('c3', 'Business and client', 'issue · dispatch · client', 'svc', { icon: 'service' })
        ], { sub: 'Sign-in and the BFF session are needed by every journey' }),
        G('slice', 'When the slice includes the step', 'netDual', [
          N('l1', 'AI triage', 'ai-triage-web + ai-triage-consumer · reporting works without them (NFR-03)', 'worker', { icon: 'gear' }),
          N('l2', 'notification', 'Needed as soon as US-10 is in the slice', 'svc', { icon: 'service' }),
          N('l3', 'calendar-sim', 'Needed when dispatch books a visit', 'platform', { icon: 'calendar' })
        ], { sub: 'No profile name proposed yet' }),
        G('later', 'Later · own profiles', 'netInt', [
          N('x1', 'demo', 'mailpit + synthetic realm users', 'platform', { icon: 'mail' }),
          N('x2', 'status (proposed name)', 'gatus, with the /status page and banner', 'obs', { icon: 'pulse' }),
          N('x3', 'observability', 'prometheus + grafana · standard in demo and release', 'obs', { icon: 'chart' }),
          N('x4', 'storage (proposed name)', 'garage · needed before the backup and restore exercise', 'store', { icon: 'bucket' })
        ])
      ],
      edges: [
        E('first', 'slice', 'then', 'thick'),
        E('slice', 'later', 'then', 'thick')
      ],
      legend: ['cats']
    }
  ];

  // ---------- Text metrics (deterministic, so browser and headless exports match) ----------
  function charW(ch) {
    if (' '.includes(ch)) return 0.28;
    if ('il.,:;|!\'`'.includes(ch)) return 0.25;
    if ('fjrt()[]{}/\\-'.includes(ch)) return 0.36;
    if ('mwMW'.includes(ch)) return 0.86;
    if (/[A-Z]/.test(ch)) return 0.66;
    if (/[0-9]/.test(ch)) return 0.56;
    if ('·→<>+*=_#@&%'.includes(ch)) return 0.6;
    return 0.54;
  }
  function textWidth(s, size, bold) {
    let w = 0;
    for (const ch of s) w += charW(ch);
    return w * size * (bold ? 1.08 : 1) * 1.04;
  }
  function wrap(s, size, max, bold) {
    if (!s) return [];
    const words = s.split(' ');
    const out = [];
    let line = '';
    for (const word of words) {
      const t = line ? line + ' ' + word : word;
      if (textWidth(t, size, bold) <= max || !line) line = t;
      else { out.push(line); line = word; }
    }
    if (line) out.push(line);
    return out;
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ---------- Card geometry ----------
  const PAD_X = 14, TAG_H = 14, NAME_H = 19, TECH_LH = 14.5, LIST_LH = 16, PAD_TOP = 11, PAD_BOT = 11;
  function measureNode(n, width) {
    const w = n.w || width;
    const inner = w - PAD_X * 2 - 4;
    const tech = wrap(n.tech, 11, inner);
    const lines = (n.lines || []).flatMap(l => wrap(l, 11, inner));
    const h = PAD_TOP + TAG_H + NAME_H + tech.length * TECH_LH + lines.length * LIST_LH + PAD_BOT;
    return { w, h: Math.max(h, 58), tech, lines };
  }
  const GROUP_PAD = { top: 50, side: 18, bottom: 18 };

  // ---------- ELK graph ----------
  function toElk(view) {
    const meta = {};
    function build(n) {
      if (n.group) {
        meta[n.id] = n;
        const headW = textWidth(n.label, 14, true) + (n.pills || []).reduce((a, p) => a + textWidth(p, 10, true) + 22, 0) + 44;
        const minW = Math.max(headW, n.sub ? textWidth(n.sub, 11) + 40 : 0);
        return {
          id: n.id,
          layoutOptions: {
            'elk.padding': `[top=${n.sub ? GROUP_PAD.top + 14 : GROUP_PAD.top},left=${GROUP_PAD.side},bottom=${GROUP_PAD.bottom},right=${GROUP_PAD.side}]`,
            'elk.nodeSize.constraints': 'MINIMUM_SIZE',
            'elk.nodeSize.minimum': `(${Math.ceil(minW)}, 60)`
          },
          children: n.children.map(build)
        };
      }
      const m = measureNode(n, view.nodeWidth);
      meta[n.id] = Object.assign({}, n, { m });
      return { id: n.id, width: m.w, height: m.h };
    }
    const graph = {
      id: 'root',
      layoutOptions: {
        'elk.algorithm': 'layered',
        'elk.direction': view.direction,
        'elk.hierarchyHandling': 'INCLUDE_CHILDREN',
        'elk.edgeRouting': 'ORTHOGONAL',
        'elk.spacing.nodeNode': '22',
        'elk.layered.spacing.nodeNodeBetweenLayers': '50',
        'elk.spacing.edgeNode': '16',
        'elk.spacing.edgeEdge': '10',
        'elk.layered.spacing.edgeNodeBetweenLayers': '20',
        'elk.layered.spacing.edgeEdgeBetweenLayers': '10',
        'elk.spacing.edgeLabel': '4',
        'elk.edgeLabels.placement': 'CENTER',
        'elk.layered.considerModelOrder.strategy': 'NODES_AND_EDGES',
        'elk.layered.nodePlacement.strategy': 'NETWORK_SIMPLEX',
        'elk.layered.mergeEdges': 'false',
        'elk.json.edgeCoords': 'CONTAINER',
        'elk.layered.crossingMinimization.forceNodeModelOrder': view.forceOrder ? 'true' : 'false',
        'elk.padding': '[top=0,left=0,bottom=0,right=0]'
      },
      children: view.nodes.map(build),
      edges: view.edges.map((e, i) => {
        const edge = { id: 'e' + i, sources: [e.from], targets: [e.to] };
        if (e.label && e.style !== 'hidden') {
          edge.labels = [{ text: e.label, width: textWidth(e.label, 10.5) + 12, height: 18 }];
        }
        return edge;
      })
    };
    return { graph, meta };
  }

  // ---------- Icons (24x24 strokes, drawn at 15 px) ----------
  const ICON = {
    service: 'M4 5h16v6H4zM4 13h16v6H4zM7 8h.01M7 16h.01',
    gear: 'M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8zM12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2',
    db: 'M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3zM4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3',
    bucket: 'M4 7h16l-2 13H6zM3 7c0-1.5 4-3 9-3s9 1.5 9 3',
    queue: 'M3 6h18M3 12h18M3 18h18M17 3l4 3-4 3',
    router: 'M3 12h18M12 3v18M7 7l-4 5 4 5M17 7l4 5-4 5',
    shield: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',
    key: 'M8 14a4 4 0 1 1 0-8a4 4 0 1 1 0 8zM11 11h10M18 11v4M15 11v3',
    window: 'M3 4h18v16H3zM3 9h18M7 6.5h.01',
    pulse: 'M3 12h4l3-7 4 14 3-7h4',
    chart: 'M4 20V4M4 20h16M8 16v-4M12 16V8M16 16v-6',
    mail: 'M3 6h18v12H3zM3 6l9 7 9-7',
    calendar: 'M4 5h16v15H4zM4 10h16M8 3v4M16 3v4',
    device: 'M7 3h10v18H7zM10 18h4',
    cloud: 'M7 18a4 4 0 0 1-.5-8A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z',
    box: 'M12 3l8 4v10l-8 4-8-4V7zM4 7l8 4 8-4M12 11v10',
    block: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM5.6 5.6l12.8 12.8',
    clock: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 7v5l3 2',
    user: 'M12 4a4 4 0 1 0 0 8a4 4 0 1 0 0-8zM4 21c0-4 3.6-7 8-7s8 3 8 7',
    server: 'M4 4h16v7H4zM4 13h16v7H4zM8 7.5h.01M8 16.5h.01',
    branch: 'M6 3v12M18 9a3 3 0 1 0 0-6a3 3 0 1 0 0 6zM6 21a3 3 0 1 0 0-6a3 3 0 1 0 0 6zM18 9c0 6-12 3-12 9',
    check: 'M4 12l5 5L20 6'
  };
  function icon(name, x, y, color) {
    const d = ICON[name];
    if (!d) return '';
    return `<path d="${d}" transform="translate(${x} ${y}) scale(0.625)" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;
  }

  // ---------- Rendering ----------
  function roundedPath(pts, r) {
    pts = pts.filter((p, i) => i === 0 || Math.hypot(p.x - pts[i - 1].x, p.y - pts[i - 1].y) > 0.5);   // drop zero-length segments
    if (pts.length < 2) return '';
    let d = `M${pts[0].x},${pts[0].y}`;
    for (let i = 1; i < pts.length - 1; i++) {
      const p0 = pts[i - 1], p1 = pts[i], p2 = pts[i + 1];
      const d1 = Math.hypot(p1.x - p0.x, p1.y - p0.y), d2 = Math.hypot(p2.x - p1.x, p2.y - p1.y);
      const rr = Math.min(r, d1 / 2, d2 / 2);
      const a = { x: p1.x - (p1.x - p0.x) / d1 * rr, y: p1.y - (p1.y - p0.y) / d1 * rr };
      const b = { x: p1.x + (p2.x - p1.x) / d2 * rr, y: p1.y + (p2.y - p1.y) / d2 * rr };
      d += ` L${a.x},${a.y} Q${p1.x},${p1.y} ${b.x},${b.y}`;
    }
    const last = pts[pts.length - 1];
    return d + ` L${last.x},${last.y}`;
  }

  function renderCard(n, x, y, w, h) {
    const c = CAT[n.cat];
    const dashed = n.cat === 'ext' || n.cat === 'open' || n.cat === 'never';
    let s = `<g class="node" data-id="${esc(n.id)}">`;
    s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="9" fill="#ffffff" stroke="${c.color}" stroke-width="1.4"${dashed ? ' stroke-dasharray="5 3"' : ''} filter="url(#shadow)"/>`;
    s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="9" fill="${c.tint}" opacity="0.55"/>`;
    s += `<rect x="${x}" y="${y + 8}" width="4" height="${h - 16}" rx="2" fill="${c.color}"/>`;
    let ty = y + PAD_TOP + 9;
    s += `<text x="${x + PAD_X}" y="${ty}" font-family="${FONT}" font-size="9" font-weight="700" letter-spacing="0.9" fill="${c.color}">${esc(c.tag)}</text>`;
    s += icon(n.icon, x + w - PAD_X - 15, y + 9, c.color);
    ty += NAME_H;
    const mono = /^[a-z0-9-]+$/.test(n.name) || /^<?[a-z0-9.-]+>?[a-z0-9.-]*$/.test(n.name);
    s += `<text x="${x + PAD_X}" y="${ty - 3}" font-family="${mono ? MONO : FONT}" font-size="${mono ? 13.5 : 13.5}" font-weight="700" fill="#0f172a">${esc(n.name)}</text>`;
    for (const t of n.m.tech) { ty += TECH_LH; s += `<text x="${x + PAD_X}" y="${ty - 2}" font-family="${FONT}" font-size="11" fill="#475569">${esc(t)}</text>`; }
    for (const t of n.m.lines) { ty += LIST_LH; s += `<text x="${x + PAD_X}" y="${ty - 2}" font-family="${FONT}" font-size="11" fill="#7f1d1d">• ${esc(t)}</text>`; }
    return s + '</g>';
  }

  function renderGroup(g, x, y, w, h) {
    const st = GROUP[g.style];
    let s = `<g class="group" data-id="${esc(g.id)}">`;
    s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="14" fill="${st.fill}" stroke="${st.stroke}" stroke-width="${st.width}"${st.dash ? ` stroke-dasharray="${st.dash}"` : ''}/>`;
    let lx = x + 16;
    s += `<text x="${lx}" y="${y + 26}" font-family="${FONT}" font-size="14" font-weight="700" fill="${st.label}">${esc(g.label)}</text>`;
    lx += textWidth(g.label, 14, true) + 10;
    for (const p of g.pills || []) {
      const pw = textWidth(p, 10, true) + 16;
      s += `<rect x="${lx}" y="${y + 13}" width="${pw}" height="18" rx="9" fill="${PILL[p]}"/>`;
      s += `<text x="${lx + pw / 2}" y="${y + 26}" text-anchor="middle" font-family="${FONT}" font-size="10" font-weight="700" fill="#ffffff">${esc(p)}</text>`;
      lx += pw + 6;
    }
    if (g.sub) {
      s += `<text x="${x + 16}" y="${y + 44}" font-family="${FONT}" font-size="11" fill="#475569">${esc(g.sub)}</text>`;
    }
    return s + '</g>';
  }

  function renderLegend(view, x, y, maxW) {
    const items = [];
    const used = new Set();
    (function walk(list) { for (const n of list) { if (n.group) walk(n.children); else used.add(n.cat); } })(view.nodes);
    for (const k of view.legend) {
      if (k === 'cats') {
        for (const c of Object.keys(CAT)) if (used.has(c)) items.push({ kind: 'cat', c, text: CAT[c].legend });
      } else if (k === 'nets') {
        items.push({ kind: 'pill', p: 'edge', text: 'edge network' });
        items.push({ kind: 'pill', p: 'internal', text: 'internal network' });
      } else if (k === 'trust') {
        items.push({ kind: 'trust', text: 'Trust boundary' });
      } else {
        const label = { solid: 'Required connection', dashed: 'Optional, later or administrative', thick: 'Main path', deny: 'Refused: no route', dlq: 'Dead-lettering', bind: 'Exchange binding' }[k];
        items.push({ kind: 'line', k: k === 'dlq' ? 'deny' : k, text: label });
      }
    }
    let s = '', cx = x, cy = y;
    for (const it of items) {
      const w = 34 + textWidth(it.text, 11) + 22;
      if (cx + w > x + maxW) { cx = x; cy += 24; }
      if (it.kind === 'cat') {
        s += `<rect x="${cx}" y="${cy - 10}" width="24" height="14" rx="4" fill="${CAT[it.c].tint}" stroke="${CAT[it.c].color}" stroke-width="1.3"/>`;
        s += `<rect x="${cx}" y="${cy - 8}" width="3" height="10" rx="1.5" fill="${CAT[it.c].color}"/>`;
      } else if (it.kind === 'pill') {
        s += `<rect x="${cx}" y="${cy - 10}" width="24" height="14" rx="7" fill="${PILL[it.p]}"/>`;
      } else if (it.kind === 'trust') {
        s += `<rect x="${cx}" y="${cy - 10}" width="24" height="14" rx="4" fill="#fff7f7" stroke="#dc2626" stroke-dasharray="4 2" stroke-width="1.5"/>`;
      } else {
        const L = LINE[it.k];
        s += `<line x1="${cx}" y1="${cy - 3}" x2="${cx + 20}" y2="${cy - 3}" stroke="${L.color}" stroke-width="${L.width}"${L.dash ? ` stroke-dasharray="${L.dash}"` : ''} marker-end="url(#arrow-${it.k})"/>`;
      }
      s += `<text x="${cx + 32}" y="${cy + 1}" font-family="${FONT}" font-size="11" fill="#334155">${esc(it.text)}</text>`;
      cx += w;
    }
    return { svg: s, height: cy - y + 16 };
  }

  async function renderView(elk, view) {
    const { graph, meta } = toElk(view);
    const out = await elk.layout(graph);
    const M = 24;            // outer margin
    const HEAD = 70;         // title block
    const W = Math.max(out.width, 760);
    const legendProbe = renderLegend(view, 0, 0, W);
    const note = wrap(view.note || '', 11.5, W);
    const H = HEAD + out.height + 26 + legendProbe.height + (note.length ? note.length * 16 + 8 : 0);
    const ox = M, oy = M + HEAD;

    const groups = [], cards = [], edges = [], labels = [];
    const abs = { root: { x: ox, y: oy } };   // edge coordinates are relative to the edge's container
    (function walk(n, px, py) {
      for (const c of n.children || []) {
        const ax = px + c.x, ay = py + c.y;
        abs[c.id] = { x: ax, y: ay };
        const m = meta[c.id];
        if (m.group) { groups.push(renderGroup(m, ax, ay, c.width, c.height)); walk(c, ax, ay); }
        else cards.push(renderCard(m, ax, ay, c.width, c.height));
      }
    })(out, ox, oy);

    out.edges.forEach((e, i) => {
      const src = view.edges[i];
      const L = LINE[src.style];
      if (!L) return;
      const base = abs[e.container] || abs.root;
      for (const sec of e.sections || []) {
        const pts = [sec.startPoint].concat(sec.bendPoints || [], [sec.endPoint]).map(p => ({ x: p.x + base.x, y: p.y + base.y }));
        edges.push(`<path d="${roundedPath(pts, 8)}" fill="none" stroke="${L.color}" stroke-width="${L.width}"${L.dash ? ` stroke-dasharray="${L.dash}"` : ''} stroke-linejoin="round" marker-end="url(#arrow-${src.style})"/>`);
      }
      for (const lb of e.labels || []) {
        const lx = lb.x + base.x, ly = lb.y + base.y;
        labels.push(`<rect x="${lx}" y="${ly}" width="${lb.width}" height="${lb.height}" rx="9" fill="#ffffff" stroke="#cbd5e1"/>` +
          `<text x="${lx + lb.width / 2}" y="${ly + 12.6}" text-anchor="middle" font-family="${FONT}" font-size="10.5" fill="#1e293b">${esc(lb.text)}</text>`);
      }
    });

    const legend = renderLegend(view, ox, oy + out.height + 34, W);
    const totalW = W + M * 2, totalH = H + M * 2;
    const markers = Object.entries(LINE).filter(([, L]) => L).map(([k, L]) =>
      `<marker id="arrow-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="${k === 'thick' ? 4.5 : 7}" markerHeight="${k === 'thick' ? 4.5 : 7}" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${L.color}"/></marker>`).join('');
    const sub = wrap(view.subtitle, 12.5, W);
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${totalW}" height="${totalH}" viewBox="0 0 ${totalW} ${totalH}" role="img" aria-labelledby="${view.id}-title ${view.id}-desc">` +
      `<title id="${view.id}-title">${esc(view.title)}</title><desc id="${view.id}-desc">${esc(view.subtitle)}</desc>` +
      `<defs>${markers}<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#0f172a" flood-opacity="0.12"/></filter></defs>` +
      `<rect width="100%" height="100%" fill="#ffffff"/>` +
      `<text x="${M}" y="${M + 22}" font-family="${FONT}" font-size="20" font-weight="700" fill="#0f172a">${esc(view.title)}</text>` +
      sub.map((t, i) => `<text x="${M}" y="${M + 44 + i * 17}" font-family="${FONT}" font-size="12.5" fill="#475569">${esc(t)}</text>`).join('') +
      `<text x="${M + W}" y="${M + 22}" text-anchor="end" font-family="${FONT}" font-size="11" fill="#94a3b8">BMC · proposed, not deployed · EN-01-03</text>` +
      groups.join('') + edges.join('') + labels.join('') + cards.join('') + legend.svg +
      note.map((t, i) => `<text x="${ox}" y="${oy + out.height + 34 + legend.height + 12 + i * 16}" font-family="${FONT}" font-size="11.5" font-style="italic" fill="#475569">${esc(t)}</text>`).join('') +
      `</svg>`;
  }

  root.BMCViews = { VIEWS, renderView };
})(typeof window !== 'undefined' ? window : globalThis);
</script>

<script>
  (async function () {
    if (typeof ELK === 'undefined') {
      document.getElementById('error').textContent = 'elkjs could not be loaded from cdn.jsdelivr.net; the views need it to lay out.';
      return;
    }
    const elk = new ELK();
    const main = document.getElementById('views');
    for (const view of BMCViews.VIEWS) {
      const svg = await BMCViews.renderView(elk, view);
      const sec = document.createElement('section');
      sec.innerHTML = `<div class="bar"><strong>${view.title}</strong><button type="button">Download SVG</button></div><div class="scroll">${svg}</div>`;
      sec.querySelector('button').addEventListener('click', () => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
        a.download = view.id + '.svg';
        a.click();
        URL.revokeObjectURL(a.href);
      });
      main.appendChild(sec);
    }
  })().catch(err => { document.getElementById('error').textContent = 'Layout failed: ' + err.message; });
</script>
</body>
