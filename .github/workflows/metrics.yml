name: Metrics Snapshot

on:
  schedule:
    - cron: "0 12 * * *" # Daily at noon in Lisbon, including daylight saving time
      timezone: "Europe/Lisbon"
    # Temporary probes for 22-23 October; remove after the experiment.
    - cron: "17 * 22,23 10 *" # UTC control
    - cron: "47 * 22,23 10 *" # Timezone-aware comparison
      timezone: "Europe/Lisbon"
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: "Test workflow execution without collecting or committing metrics"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: metrics-snapshot
  cancel-in-progress: false

jobs:
  schedule-probe:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.diagnostic_only) ||
      (github.event_name == 'schedule' && github.event.schedule != '0 12 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Record trigger evidence
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref }}
        run: |
          {
            echo "## Schedule probe"
            echo "Event: $EVENT_NAME"
            echo "Cron: ${SCHEDULE:-manual}"
            echo "Runner UTC: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "Runner Lisbon: $(TZ=Europe/Lisbon date '+%Y-%m-%dT%H:%M:%S%z')"
            echo "Ref: $REF_NAME"
            echo "SHA: $HEAD_SHA"
            echo "Run: $RUN_URL"
            echo "No checkout, PAT, collector or repository writes were used."
          } | tee -a "$GITHUB_STEP_SUMMARY"

  snapshot:
    if: >-
      (github.event_name == 'workflow_dispatch' && !inputs.diagnostic_only) ||
      (github.event_name == 'schedule' && github.event.schedule == '0 12 * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.MY_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run script
        env:
          GITHUB_TOKEN: ${{ secrets.MY_PAT }}
        run: node workflow-scripts/snapshot.js

      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add workflow-scripts/data/
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "update metrics"
          git pull --rebase origin main
          git push origin HEAD:main
